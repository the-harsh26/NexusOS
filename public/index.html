<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPOM NEXUS OS</title>
    <link rel="stylesheet" href="/css/tokens.css">
</head>
<body>
    <header id="header">
        <span style="color: var(--signal)">NEXUS</span>&nbsp;OS // CA FINAL COMMAND CENTER
        <div id="system-health" style="margin-left: auto; font-size: 12px;">SYSTEM_READY</div>
    </header>

    <aside id="sidebar">
        <div style="padding: 15px; font-family: var(--font-mono); font-size: 12px;">
            <div style="color: var(--signal)">[1] SPOM-A: CORP LAWS</div>
            <div style="color: var(--text-muted); margin-top: 10px;">[2] SPOM-B: SCPM</div>
        </div>
    </aside>

    <main id="workspace">
        <div id="media-container">
            <div id="player-status" style="font-family: var(--font-mono); color: var(--text-muted)">AWAITING MEDIA COMMAND...</div>
        </div>
        <div id="player-controls" style="height: 50px; border-top: var(--border-thin); display: flex; align-items: center; padding: 0 15px;">
            <button id="btn-play">PLAY</button>
            <span id="time-display" style="margin-left: 15px; font-family: var(--font-mono);">00:00:00 / 00:00:00</span>
        </div>
    </main>

    <div id="telemetry-terminal">
        <div id="term-output"></div>
    </div>

    <aside id="tools-panel">
        <div id="pomodoro-display" style="font-size: 3rem; text-align: center; margin-top: 20px; font-family: var(--font-mono);">25:00</div>
    </aside>

    <div id="cmd-palette">
        <input type="text" id="cmd-input" placeholder="> Exec command..." autocomplete="off">
        <ul id="cmd-results" style="list-style: none; padding: 0; margin: 0; max-height: 300px; overflow-y: auto;"></ul>
    </div>

    <script type="module" src="/js/app.js"></script>
</body>
</html>
